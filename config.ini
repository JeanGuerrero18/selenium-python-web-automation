# Valores por defecto para ejecuciones locales. Cada clave se puede sobrescribir con una variable
# de entorno (mayúsculas, guiones bajos en vez de puntos, p. ej. SAUCEDEMO_PASSWORD), y
# browser/headless también con las opciones de pytest --browser / --headless.
[settings]
browser = chrome
headless = false
timeout.seconds = 10
window.width = 1920
window.height = 1080

saucedemo.url = https://www.saucedemo.com/
theinternet.url = https://the-internet.herokuapp.com

# Credenciales públicas de demo, impresas en la propia página de login de cada sitio. En una
# aplicación real deja estas claves fuera del archivo e inyéctalas como variables de entorno o
# secretos de CI.
saucedemo.password = secret_sauce
theinternet.username = tomsmith
theinternet.password = SuperSecretPassword!

name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m expression (e.g. smoke). Empty runs everything."
        default: ""
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  ui-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      # Deja que cada navegador termine para que un fallo no oculte los demás
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Chrome, Firefox y Edge vienen preinstalados en ubuntu-latest;
      # Selenium Manager descarga los drivers correspondientes en tiempo de ejecución.
      # Los inputs pasan por variables de entorno, nunca interpolados en el script (evita inyección de shell).
      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
          MARKER: ${{ inputs.marker }}
        run: |
          if [ -n "$MARKER" ]; then
            pytest --browser "$BROWSER" --headless -m "$MARKER"
          else
            pytest --browser "$BROWSER" --headless
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/
          retention-days: 14
